<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="450" viewBox="0 0 1080 450" role="img" aria-label="Illustrative screen: BACKUPS — fortnightly">
<rect width="1080" height="450" rx="20" fill="#10161e"/><rect x="22" y="24" width="1036" height="404" rx="14" fill="#241126" stroke="#6e4b77" stroke-width="2"/>
<rect x="22" y="24" width="1036" height="56" rx="14" fill="#392142"/><circle cx="1010" cy="51" r="11" fill="#ab6872"/>
<text x="50" y="60" font-size="22" fill="white" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold">BACKUPS — fortnightly</text>
<text x="50" y="122" font-size="18" font-family="DejaVu Sans Mono,monospace" fill="#e8edf5">Source: detected Ubuntu ZFS root / boot pools</text><text x="50" y="170" font-size="18" font-family="DejaVu Sans Mono,monospace" fill="#88dcfa">Destination: enrolled external ZFS pool GUID</text><text x="50" y="218" font-size="18" font-family="DejaVu Sans Mono,monospace" fill="#68d391">Every 14 days: changed blocks streamed incrementally</text><text x="50" y="266" font-size="18" font-family="DejaVu Sans Mono,monospace" fill="#e8edf5">Transfer speed: 16 MiB/s (configurable)</text><text x="50" y="314" font-size="18" font-family="DejaVu Sans Mono,monospace" fill="#e8edf5">Disk I/O priority: idle    /    verify received snapshot</text><text x="50" y="362" font-size="18" font-family="DejaVu Sans Mono,monospace" fill="#f8c77e">Offline external drive: defer; local recovery continues</text>
<text x="50" y="401" font-size="14" fill="#b8a8c1" font-family="DejaVu Sans,Arial,sans-serif">ILLUSTRATION — not a screenshot of a deployed system</text></svg>